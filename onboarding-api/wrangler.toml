# Properfy onboarding API (Cloudflare Worker). See README.md in this folder.
name = "properfy-onboarding"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
SITE_ORIGIN = "https://properfy.co.uk"
OFFICE_EMAIL = "info@properfy.co.uk"
FROM_EMAIL = "Properfy <info@properfy.co.uk>"
STRIPE_API_BASE = "https://api.stripe.com"
RESEND_API_BASE = "https://api.resend.com"
# Countries allowed to use the API (comma-separated codes). GB is the whole UK.
# Stripe's webhook is always allowed, as Stripe calls it from abroad.
ALLOWED_COUNTRIES = "GB"
# Bank transfer (Starling): "off" until the Starling account is live, then
# "on" (and set bankTransfers: true in assets/js/data.js). Card works either way.
BANK_TRANSFERS = "off"
# Starling account for bank transfers. The sort code and account number are
# set privately (below), not in this public repository.
BANK_ACCOUNT_NAME = "Properfy Ltd"
# Secrets, set with `npx wrangler secret put NAME` (never commit them):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, ADMIN_SECRET,
#   BANK_SORT_CODE, BANK_ACCOUNT_NUMBER

# Every morning at 07:00 UTC (08:00 in summer): email Properfy the clients
# whose cancellation period has ended.
[triggers]
crons = ["0 7 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "properfy-onboarding"
database_id = "794b11e4-23ca-4633-aea5-493f6ccd3de1" # EU jurisdiction (wrangler d1 create --jurisdiction eu)

[[r2_buckets]]
binding = "AGREEMENTS"
bucket_name = "properfy-agreements" # private: never enable public access
jurisdiction = "eu" # created with --jurisdiction eu (see README.md)

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
